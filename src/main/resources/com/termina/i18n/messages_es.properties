# Settings sync
settings.cat.sync=Sincronización
settings.section.syncRepository=Repositorio
settings.section.syncStatus=Sincronizar
settings.section.syncWhat=Qué se sincroniza
settings.sync.repository=Repositorio
settings.sync.repository.desc=La URL de un repositorio Git privado tuyo, vacío o ya usado por otro de tus ordenadores. Termina inicia sesión a través de git: tu asistente de credenciales o tu clave SSH.
settings.sync.repository.prompt=git@github.com:tu/termina-sync.git
settings.sync.repository.invalid=Escribe la URL de un repositorio Git.
settings.sync.repository.credentials=Esta URL contiene una contraseña o un token, que se guardaría en texto plano. Usa {0} e inicia sesión con un asistente de credenciales de Git (para GitHub: gh auth setup-git), o usa una URL SSH.
settings.sync.branch=Rama
settings.sync.branch.desc=La rama donde se guardan los archivos sincronizados; main, salvo que el repositorio contenga también otra cosa.
settings.sync.branch.invalid=Un nombre de rama son letras, dígitos, . _ - y /, sin .. ni / al principio o al final.
settings.sync.connection=Conexión
settings.sync.connection.desc=Al conectar se hace enseguida la primera sincronización, que conserva lo que hay aquí y lo que hay en el repositorio. Al desconectar también se conservan ambos; solo se elimina la copia del repositorio de este ordenador.
settings.sync.connect=Conectar
settings.sync.disconnect=Desconectar
settings.sync.status=Estado
settings.sync.now=Sincronizar ahora
settings.sync.anyway=Sincronizar de todos modos
settings.sync.auto=Sincronizar automáticamente
settings.sync.auto.desc=Al iniciar, medio minuto después de cambiar un atajo y con el intervalo de abajo mientras haya una ventana de Termina al frente. Nunca pide una contraseña; los fallos se muestran aquí.
settings.sync.interval=Intervalo (minutos)
settings.sync.interval.desc=Cada cuánto buscar cambios hechos en tus otros ordenadores.
settings.sync.keybindings=Atajos de teclado
settings.sync.keybindings.desc=Los atajos que cambias en la página Teclado. Los Mac comparten una lista y los ordenadores Windows y Linux otra, porque la misma combinación significa una tecla distinta en cada uno.
settings.sync.notSynced=No se sincroniza: todo lo demás de settings.properties, incluidos los perfiles, que nombran los shells por su ruta en cada ordenador. Si el mismo atajo se cambió en dos ordenadores, el que sincroniza conserva su versión y la otra queda en el historial del repositorio. Los atajos que reemplaza una sincronización se copian antes a la carpeta de sincronización.
sync.state.off=No conectado.
sync.state.never=Conectado. Aún sin sincronizar.
sync.state.syncing=Sincronizando…
sync.state.ok=Última sincronización a las {0}: {1}.
sync.state.secondary=Otro Termina que usa esta carpeta de ajustes es el que sincroniza; este le deja el repositorio.
sync.state.account=Se inicia sesión como {0} mediante la CLI de GitHub, sea cual sea la cuenta activa allí.
sync.state.tooLateToCancel=Demasiado tarde para cancelar: se están escribiendo los atajos combinados y la sincronización terminará.
sync.result.upToDate=al día
sync.result.counts={0} recibidos, {1} enviados
sync.result.conflicts=cambiados en ambos ordenadores, se conserva el de este: {0}
sync.problem.noGit=La sincronización falló: Git no está instalado o no se pudo iniciar.
sync.problem.fetchFailed=No se pudo acceder al repositorio: {0}
sync.problem.pushFailed=No se pudieron enviar los cambios de este ordenador; se volverá a intentar: {0}
sync.problem.newerFormat=Sincronización detenida: el repositorio lo escribió un Termina más reciente. Actualiza Termina en este ordenador.
sync.problem.needsConfirmation=Sincronización detenida: eliminaría la mayoría de tus atajos. Pulsa Sincronizar de todos modos si es lo que querías.
sync.problem.failed=La sincronización falló: {0}
settings.sync.removeCredentials=Quitar de la URL
sync.state.credentials=Sin sincronizar: la URL del repositorio en settings.properties contiene una contraseña o un token, guardado ahí en texto plano. Quítalo de la URL y git iniciará sesión con tu asistente de credenciales o tu clave SSH.
sync.state.invalid=Sin sincronizar: la URL del repositorio o la rama en settings.properties no se pueden usar. Desconecta, corrígelas y vuelve a conectar.
sync.state.notSetUp=La sincronización no está conectada. Configúrala en Configuración ▸ Sincronización.
sync.done=Sincronización: {0}.
sync.problem.insideRepository=No se puede sincronizar: {0} está dentro de un repositorio Git tuyo. Añade "sync/" a su .gitignore y vuelve a sincronizar.
sync.problem.busy=Tus atajos cambiaron durante la sincronización; se volverá a intentar en medio minuto.
sync.problem.cancelled=Sincronización cancelada. No se cambió nada en este ordenador.
