# Termina UI strings. English is the base catalogue and the fallback for every other
# language, so a key missing from a translation shows the English text rather than a gap.
#
# An apostrophe is doubled in any value carrying a {0}: those go through MessageFormat,
# where a single quote starts a quoted section and silently eats the placeholder.

