settings.sync.repository=Repository
settings.sync.repository.desc=The URL of a private Git repository you own, empty or already used by another of your computers. Termina signs in through git: your credential helper or SSH key.
settings.sync.repository.prompt=git@github.com:you/termina-sync.git
settings.sync.repository.invalid=Enter the URL of a Git repository.
settings.sync.repository.credentials=This URL contains a password or token, which would be saved in plain text. Use {0} and sign in with a Git credential helper (for GitHub: gh auth setup-git), or use an SSH URL.
settings.sync.branch=Branch
settings.sync.branch.desc=The branch the synced files are kept on; main unless the repository also holds something else.
settings.sync.branch.invalid=A branch name is letters, digits, . _ - and /, without .. or a / at either end.
settings.sync.connection=Connection
settings.sync.connection.desc=Connecting runs the first sync at once, which keeps what is here and what is in the repository. Disconnecting keeps both too; only this computer's copy of the repository is removed.
settings.sync.connect=Connect
settings.sync.disconnect=Disconnect
settings.sync.status=Status
settings.sync.now=Sync Now
settings.sync.anyway=Sync Anyway
settings.sync.auto=Sync automatically
settings.sync.auto.desc=After startup, half a minute after you change a key binding, and at the interval below while a Termina window is in front. It never asks for a password; a failure shows here.
settings.sync.interval=Interval (minutes)
settings.sync.interval.desc=How often to look for changes made on your other computers.
settings.sync.keybindings=Key bindings
settings.sync.keybindings.desc=The shortcuts you change on the Keyboard page. Macs share one list and Windows and Linux computers another, because the same chord means a different key on each.
settings.sync.notSynced=Not synced: everything else in settings.properties, including profiles, which name shells by their path on each computer. When the same shortcut was changed on two computers, the one that syncs keeps its version and the other stays in the repository's history. Bindings a sync replaces are copied to the sync folder first.
sync.state.off=Not connected.
sync.state.never=Connected. Not synced yet.
sync.state.syncing=Syncing…
sync.state.ok=Last synced at {0}: {1}.
sync.state.secondary=Another Termina using this settings folder is the one syncing; this one leaves the repository to it.
sync.state.account=Signing in as {0} through the GitHub CLI, whichever account is active there.
sync.state.tooLateToCancel=Too late to cancel: the merged key bindings are being written, and the sync will finish.
sync.result.upToDate=up to date
sync.result.counts={0} received, {1} sent
sync.result.conflicts=changed on both computers, kept from this one: {0}
sync.problem.noGit=Sync failed: Git is not installed, or could not be started.
sync.problem.fetchFailed=Sync could not reach the repository: {0}
sync.problem.pushFailed=Sync could not send this computer''s changes and will try again: {0}
sync.problem.newerFormat=Sync stopped: the repository was written by a newer Termina. Update Termina on this computer.
sync.problem.needsConfirmation=Sync stopped: it would remove most of your key bindings. Sync Anyway if that is what you meant.
sync.problem.failed=Sync failed: {0}
settings.sync.removeCredentials=Remove from URL
