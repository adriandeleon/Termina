settings.fontSize=Font size
settings.fontSize.desc=Also adjustable at any time with {0} and the + / - keys.
settings.hideTabBar=Hide the tab bar with a single tab
settings.hideTabBar.desc=The row is reclaimed for the terminal, so the shell gains a line.
settings.showMenuBar=Show the menu bar
settings.showMenuBar.desc=Hiding it keeps every command reachable by keyboard, and Settings stays on the right-click menu.
settings.showMenuBar.mac=macOS puts the menus in the screen menu bar, so there is nothing in the window to hide.
settings.menuBarInTitleBar=Put the menu bar in the title bar
settings.menuBarInTitleBar.desc=One row holds the menus, the window title and the window buttons, and the terminal gains the row. Applies to windows opened afterwards.
settings.menuBarInTitleBar.mac=macOS puts the menus in the screen menu bar, so there is no menu bar to move into the title bar.
settings.menuBarInTitleBar.unsupported=This platform cannot draw its own title bar.
settings.showScrollBar=Show a scrollbar
settings.showScrollBar.desc=It takes a column of width rather than floating over the text. The wheel scrolls the history either way.
settings.windowOpacity=Window opacity
settings.windowOpacity.desc=Plain transparency, with no blur behind it — so it fades the text along with the background. Applies to terminal windows only.
settings.cursorShape=Cursor shape
settings.cursorShape.desc=A program can still request its own shape while it is running.
settings.bell=Visual bell
settings.bell.desc=Flashes the screen instead of making a sound.
settings.notifications=Desktop notifications
settings.notifications.desc=A program can post a notification (OSC 9 or 777), such as a build saying it has finished. It reaches the desktop when you are not looking at its pane; its tab is marked either way.
settings.scrollback=Scrollback lines
settings.scrollback.desc=Held in memory. Takes effect in the next session.
settings.shell=Shell
settings.shell.desc=Started as a login shell. Takes effect in the next session.
settings.altIsMeta=Use Alt as Meta
settings.altIsMeta.desc=On for readline's M-b and M-f. Off lets Alt compose characters, which is what macOS Option normally does.
settings.confirmPaste=Ask before pasting several lines
settings.confirmPaste.desc=A pasted line break runs the line at a prompt. Asking first shows what the clipboard actually holds.
settings.copyOnSelect=Copy on select
settings.copyOnSelect.desc=A selection goes to the clipboard as soon as it is made, with no Copy needed. On Linux it is also the middle-click selection, whether or not this is on.
settings.settingsFile=Settings file
settings.settingsFile.desc=A plain properties file; safe to edit by hand while Termina is closed.
settings.language=Interface language
settings.language.desc=Takes effect after a restart.
