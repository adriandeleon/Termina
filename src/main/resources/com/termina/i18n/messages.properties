sync.state.creating=Creating the repository on GitHub…
sync.state.credentials=Not syncing: the repository URL in settings.properties contains a password or token, kept there in plain text. Remove it from the URL and git signs in with your credential helper or SSH key instead.
sync.state.invalid=Not syncing: the repository URL or branch in settings.properties cannot be used. Disconnect, correct it, and connect again.
