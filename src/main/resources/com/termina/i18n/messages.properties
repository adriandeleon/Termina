settings.theme.desc=Applies to this window and the terminal palette.
settings.importTheme=Import a theme
settings.importTheme.desc=Reads a color scheme another terminal wrote: iTerm2 (.itermcolors), Terminal (.terminal), Windows Terminal (a scheme or settings.json), Ghostty, kitty or Alacritty. Its colors are kept exactly as the file has them.
