# Settings sync
settings.cat.sync=Synchronisierung
settings.section.syncRepository=Repository
settings.section.syncStatus=Synchronisieren
settings.section.syncWhat=Was synchronisiert wird
settings.sync.repository=Repository
settings.sync.repository.desc=Die URL eines privaten Git-Repositorys, das Ihnen gehört – leer oder bereits von einem anderen Ihrer Computer verwendet. Termina meldet sich über Git an: mit Ihrem Credential-Helper oder SSH-Schlüssel.
settings.sync.repository.prompt=git@github.com:sie/termina-sync.git
settings.sync.repository.invalid=Geben Sie die URL eines Git-Repositorys ein.
settings.sync.repository.credentials=Diese URL enthält ein Passwort oder Token, das im Klartext gespeichert würde. Verwenden Sie {0} und melden Sie sich über einen Git-Credential-Helper an (für GitHub: gh auth setup-git), oder verwenden Sie eine SSH-URL.
settings.sync.branch=Branch
settings.sync.branch.desc=Der Branch, auf dem die synchronisierten Dateien liegen; main, sofern das Repository nicht noch anderes enthält.
settings.sync.branch.invalid=Ein Branch-Name besteht aus Buchstaben, Ziffern, . _ - und /, ohne .. und ohne / am Anfang oder Ende.
settings.sync.connection=Verbindung
settings.sync.connection.desc=Beim Verbinden läuft sofort die erste Synchronisierung; sie behält, was hier und was im Repository ist. Auch Trennen behält beides; nur die Kopie des Repositorys auf diesem Computer wird entfernt.
settings.sync.connect=Verbinden
settings.sync.disconnect=Trennen
settings.sync.status=Status
settings.sync.now=Jetzt synchronisieren
settings.sync.anyway=Trotzdem synchronisieren
settings.sync.auto=Automatisch synchronisieren
settings.sync.auto.desc=Nach dem Start, eine halbe Minute nach dem Ändern einer Tastenbelegung und im unten eingestellten Abstand, solange ein Termina-Fenster vorne ist. Es wird nie nach einem Passwort gefragt; ein Fehler wird hier angezeigt.
settings.sync.interval=Abstand (Minuten)
settings.sync.interval.desc=Wie oft nach Änderungen von Ihren anderen Computern gesucht wird.
settings.sync.keybindings=Tastenbelegungen
settings.sync.keybindings.desc=Die Kurzbefehle, die Sie auf der Seite Tastatur ändern. Macs teilen eine Liste, Windows- und Linux-Computer eine andere, denn dieselbe Tastenkombination meint auf beiden eine andere Taste.
settings.sync.notSynced=Nicht synchronisiert: alles andere in settings.properties, auch die Profile, die Shells über ihren Pfad auf dem jeweiligen Computer benennen. Wurde derselbe Kurzbefehl auf zwei Computern geändert, behält der synchronisierende seine Fassung, die andere bleibt im Verlauf des Repositorys. Belegungen, die eine Synchronisierung ersetzt, werden vorher in den Sync-Ordner kopiert.
sync.state.off=Nicht verbunden.
sync.state.never=Verbunden. Noch nicht synchronisiert.
sync.state.syncing=Synchronisiere…
sync.state.ok=Zuletzt synchronisiert um {0}: {1}.
sync.state.secondary=Ein anderes Termina mit diesem Einstellungsordner synchronisiert; dieses überlässt ihm das Repository.
sync.state.account=Anmeldung als {0} über die GitHub CLI, unabhängig davon, welches Konto dort aktiv ist.
sync.state.tooLateToCancel=Zu spät zum Abbrechen: Die zusammengeführten Tastenbelegungen werden geschrieben, die Synchronisierung wird abgeschlossen.
sync.result.upToDate=aktuell
sync.result.counts={0} empfangen, {1} gesendet
sync.result.conflicts=auf beiden Computern geändert, von diesem behalten: {0}
sync.problem.noGit=Synchronisierung fehlgeschlagen: Git ist nicht installiert oder ließ sich nicht starten.
sync.problem.fetchFailed=Das Repository war nicht erreichbar: {0}
sync.problem.pushFailed=Die Änderungen dieses Computers konnten nicht gesendet werden; es wird erneut versucht: {0}
sync.problem.newerFormat=Synchronisierung angehalten: Das Repository wurde von einem neueren Termina geschrieben. Aktualisieren Sie Termina auf diesem Computer.
sync.problem.needsConfirmation=Synchronisierung angehalten: Sie würde die meisten Ihrer Tastenbelegungen entfernen. Wählen Sie „Trotzdem synchronisieren“, wenn das beabsichtigt ist.
sync.problem.failed=Synchronisierung fehlgeschlagen: {0}
settings.sync.removeCredentials=Aus der URL entfernen
sync.state.credentials=Keine Synchronisierung: Die Repository-URL in settings.properties enthält ein Passwort oder Token, das dort im Klartext steht. Entfernen Sie es aus der URL, dann meldet sich Git über Ihren Credential-Helper oder SSH-Schlüssel an.
sync.state.invalid=Keine Synchronisierung: Die Repository-URL oder der Branch in settings.properties ist nicht verwendbar. Trennen, korrigieren und erneut verbinden.
sync.state.notSetUp=Die Synchronisierung ist nicht verbunden. Richten Sie sie unter Einstellungen ▸ Synchronisierung ein.
sync.done=Synchronisierung: {0}.
sync.problem.insideRepository=Synchronisierung nicht möglich: {0} liegt in einem Ihrer Git-Repositorys. Fügen Sie „sync/“ zu dessen .gitignore hinzu und synchronisieren Sie erneut.
sync.problem.busy=Ihre Tastenbelegungen haben sich während der Synchronisierung geändert; in einer halben Minute wird es erneut versucht.
sync.problem.cancelled=Synchronisierung abgebrochen. Auf diesem Computer wurde nichts geändert.
