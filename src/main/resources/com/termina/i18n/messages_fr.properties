sync.state.account=Connexion en tant que {0} via la CLI GitHub, quel que soit le compte actif dans celle-ci.
sync.state.tooLateToCancel=Trop tard pour annuler : les raccourcis fusionnés sont en cours d'écriture et la synchronisation va se terminer.
sync.result.upToDate=à jour
sync.result.counts={0} reçus, {1} envoyés
sync.result.conflicts=modifiés sur les deux ordinateurs, version de celui-ci conservée : {0}
