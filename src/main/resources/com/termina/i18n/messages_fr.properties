settings.sync.repository=Dépôt
settings.sync.repository.desc=L'URL d'un dépôt Git privé qui vous appartient, vide ou déjà utilisé par un autre de vos ordinateurs. Termina s'authentifie via git : votre assistant d'identification ou votre clé SSH.
settings.sync.repository.prompt=git@github.com:vous/termina-sync.git
settings.sync.repository.invalid=Saisissez l'URL d'un dépôt Git.
settings.sync.repository.credentials=Cette URL contient un mot de passe ou un jeton, qui serait enregistré en clair. Utilisez {0} et authentifiez-vous avec un assistant d''identification Git (pour GitHub : gh auth setup-git), ou utilisez une URL SSH.
settings.sync.branch=Branche
settings.sync.branch.desc=La branche où sont conservés les fichiers synchronisés ; main, sauf si le dépôt contient aussi autre chose.
settings.sync.branch.invalid=Un nom de branche se compose de lettres, chiffres, . _ - et /, sans .. ni / au début ou à la fin.
settings.sync.connection=Connexion
settings.sync.connection.desc=La connexion lance aussitôt la première synchronisation, qui conserve ce qui est ici et ce qui est dans le dépôt. La déconnexion conserve aussi les deux ; seule la copie du dépôt sur cet ordinateur est supprimée.
settings.sync.connect=Connecter
settings.sync.disconnect=Déconnecter
settings.sync.status=État
settings.sync.now=Synchroniser maintenant
settings.sync.anyway=Synchroniser quand même
settings.sync.auto=Synchroniser automatiquement
settings.sync.auto.desc=Au démarrage, une demi-minute après la modification d'un raccourci, et à l'intervalle ci-dessous tant qu'une fenêtre Termina est au premier plan. Aucun mot de passe n'est jamais demandé ; un échec s'affiche ici.
settings.sync.interval=Intervalle (minutes)
settings.sync.interval.desc=À quelle fréquence chercher les modifications faites sur vos autres ordinateurs.
settings.sync.keybindings=Raccourcis clavier
settings.sync.keybindings.desc=Les raccourcis que vous modifiez dans la page Clavier. Les Mac partagent une liste et les ordinateurs Windows et Linux une autre, car la même combinaison désigne une touche différente sur chacun.
settings.sync.notSynced=Non synchronisé : tout le reste de settings.properties, y compris les profils, qui désignent les shells par leur chemin sur chaque ordinateur. Si le même raccourci a été modifié sur deux ordinateurs, celui qui synchronise garde sa version et l'autre reste dans l'historique du dépôt. Les raccourcis remplacés par une synchronisation sont d'abord copiés dans le dossier de synchronisation.
sync.state.off=Non connecté.
