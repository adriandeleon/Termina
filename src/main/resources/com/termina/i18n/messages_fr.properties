sync.problem.fetchFailed=Impossible d''atteindre le dépôt : {0}
sync.problem.pushFailed=Impossible d''envoyer les modifications de cet ordinateur ; nouvel essai plus tard : {0}
sync.problem.newerFormat=Synchronisation arrêtée : le dépôt a été écrit par un Termina plus récent. Mettez Termina à jour sur cet ordinateur.
sync.problem.needsConfirmation=Synchronisation arrêtée : elle supprimerait la plupart de vos raccourcis. Choisissez Synchroniser quand même si c'est voulu.
sync.problem.failed=Échec de la synchronisation : {0}
