settings.sync.removeCredentials.confirmDetail=La synchronisation utilisera alors les identifiants de git (un assistant d'identification, une clé SSH ou la CLI GitHub). Gardez d'abord une copie du jeton si vous en avez encore besoin.
settings.sync.createGithub=Créer sur GitHub…
settings.sync.githubDescription=Synchronisation des réglages de Termina
dialog.sync.createGithub.header=Créer un dépôt privé sur GitHub
