command.debugLog.find.desc=Ouvre le journal de débogage avec sa barre de recherche ; relancée, la commande passe à l’occurrence suivante.
command.debugLog.refresh=Actualiser le journal de débogage
command.debugLog.refresh.desc=Ouvre le journal de débogage avec tout ce qui a été consigné jusqu’ici.
command.debugLog.copy=Copier le journal de débogage
command.debugLog.copy.desc=Copie le texte sélectionné du journal de débogage, ou tout le journal si rien n’est sélectionné.
command.debugLog.export=Exporter le journal de débogage…
command.debugLog.export.desc=Enregistre le journal de débogage de cette session dans le fichier de votre choix.
command.debugLog.clear=Vider le journal de débogage
command.debugLog.clear.desc=Vide le journal de débogage.
command.messageLog.copy=Copier le journal des messages
command.messageLog.copy.desc=Copie les lignes sélectionnées du journal des messages, ou toutes si aucune n’est sélectionnée.
command.messageLog.clear=Vider le journal des messages
command.messageLog.clear.desc=Vide le journal des messages et, avec lui, le compteur d’erreurs non lues de la barre d’état.
