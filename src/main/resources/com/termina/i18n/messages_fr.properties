sync.state.creating=Création du dépôt sur GitHub…
sync.state.credentials=Pas de synchronisation : l'URL du dépôt dans settings.properties contient un mot de passe ou un jeton, conservé là en clair. Retirez-le de l'URL et git s'authentifiera avec votre assistant d'identification ou votre clé SSH.
sync.state.invalid=Pas de synchronisation : l'URL du dépôt ou la branche dans settings.properties est inutilisable. Déconnectez, corrigez, puis reconnectez.
sync.state.notSetUp=La synchronisation n'est pas connectée. Configurez-la dans Préférences ▸ Synchronisation.
sync.done=Synchronisation : {0}.
sync.problem.insideRepository=Synchronisation impossible : {0} se trouve dans l''un de vos dépôts Git. Ajoutez « sync/ » à son .gitignore, puis synchronisez à nouveau.
sync.problem.busy=Vos raccourcis ont changé pendant la synchronisation ; nouvel essai dans une demi-minute.
sync.problem.cancelled=Synchronisation annulée. Rien n'a été modifié sur cet ordinateur.
