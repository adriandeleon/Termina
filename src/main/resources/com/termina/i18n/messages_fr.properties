settings.sync.createGithub.failed=Impossible de créer le dépôt : {0}
sync.state.creating=Création du dépôt sur GitHub…
sync.state.credentials=Pas de synchronisation : l'URL du dépôt dans settings.json contient un mot de passe ou un jeton, conservé là en clair. Retirez-le de l'URL et git s'authentifiera avec votre assistant d'identification ou votre clé SSH.
sync.state.invalid=Pas de synchronisation : l'URL du dépôt ou la branche dans settings.json est inutilisable. Déconnectez, corrigez, puis reconnectez.
