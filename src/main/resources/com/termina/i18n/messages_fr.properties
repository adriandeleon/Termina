menu.hideStatusBar=Masquer la barre d’état
command.view.messageLog=Journal des messages
command.view.messageLog.desc=Liste ce que Termina a signalé pendant cette session, du plus récent au plus ancien, avec l’heure de chaque message.
command.debugLog=Journal de débogage
command.debugLog.desc=Affiche les avertissements, erreurs et plantages enregistrés pendant cette session, à copier dans un rapport de bogue.
