# Status bar and Message Log
settings.showStatusBar=Afficher la barre d’état
settings.showStatusBar.desc=Une ligne sous le terminal qui indique ce que la dernière commande a signalé, avec le nombre d’erreurs non lues. Cliquez dessus pour ouvrir le journal des messages. Désactivée, ces messages s’affichent dans une boîte de dialogue et dans le journal.
