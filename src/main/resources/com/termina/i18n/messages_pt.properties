settings.sync.repository=Repositório
settings.sync.repository.desc=O URL de um repositório Git privado seu, vazio ou já usado por outro dos seus computadores. O Termina autentica-se através do git: o seu assistente de credenciais ou a sua chave SSH.
settings.sync.repository.prompt=git@github.com:voce/termina-sync.git
settings.sync.repository.invalid=Introduza o URL de um repositório Git.
settings.sync.repository.credentials=Este URL contém uma palavra-passe ou um token, que seria guardado em texto simples. Use {0} e autentique-se com um assistente de credenciais do Git (para o GitHub: gh auth setup-git), ou use um URL SSH.
settings.sync.branch=Ramo
settings.sync.branch.desc=O ramo onde ficam os ficheiros sincronizados; main, a menos que o repositório contenha também outra coisa.
settings.sync.branch.invalid=Um nome de ramo tem letras, algarismos, . _ - e /, sem .. nem / no início ou no fim.
settings.sync.connection=Ligação
settings.sync.connection.desc=Ligar faz logo a primeira sincronização, que mantém o que está aqui e o que está no repositório. Desligar também mantém ambos; só a cópia do repositório neste computador é removida.
settings.sync.connect=Ligar
settings.sync.disconnect=Desligar
settings.sync.status=Estado
settings.sync.now=Sincronizar agora
settings.sync.anyway=Sincronizar mesmo assim
settings.sync.auto=Sincronizar automaticamente
settings.sync.auto.desc=Ao iniciar, meio minuto depois de alterar um atalho e no intervalo abaixo enquanto houver uma janela do Termina à frente. Nunca pede uma palavra-passe; uma falha é mostrada aqui.
settings.sync.interval=Intervalo (minutos)
settings.sync.interval.desc=Com que frequência procurar alterações feitas nos seus outros computadores.
settings.sync.keybindings=Atalhos de teclado
settings.sync.keybindings.desc=Os atalhos que altera na página Teclado. Os Mac partilham uma lista e os computadores Windows e Linux outra, porque a mesma combinação designa uma tecla diferente em cada um.
settings.sync.notSynced=Não sincronizado: tudo o resto de settings.properties, incluindo os perfis, que designam os shells pelo caminho em cada computador. Se o mesmo atalho foi alterado em dois computadores, o que sincroniza mantém a sua versão e a outra fica no histórico do repositório. Os atalhos que uma sincronização substitui são primeiro copiados para a pasta de sincronização.
