name: Bug report
description: Something in Termina went wrong. About → Copy details fills in the environment.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what Termina did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can make it happen again, how? Which shell, and which program was running?
      placeholder: |
        1. Open …
        2. Run …
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: What `termina --version` prints. About → Copy details copies the same.
      render: text
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: Anything from Settings → Advanced → Show Debug Log… that looks related. Read it before you submit — anything left in it becomes public.
      render: text
