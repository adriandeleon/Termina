# Build and test on all three platforms.
#
# Termina claims to be cross-platform, and until this existed only macOS had ever compiled it. The
# Windows shell resolution in particular — pwsh, then powershell, then COMSPEC — had never run
# anywhere at all.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Read-only: nothing here publishes, and the build runs Maven against a repository outside Central.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an older one on the same pull request; nothing is learned from finishing
  # a run against code that has already been replaced. Never on master (REL-26, Pauta 2.0.2): each
  # of its commits keeps its own result, so a break can be pinned to the commit that made it.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Its own job and its own check (REL-19, Pauta 2.0.2), so "unformatted" and "broken" are told
  # apart at a glance, and the format check can be required on master by name. Verify below runs it
  # too; this one answers in a minute.
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check formatting
        run: ./mvnw -B --no-transfer-progress spotless:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # One set of coverage floors, in the pom, and no profile lowers it (PLAT-12, Pauta 6.0.1).
      # Windows skips the tests that drive real shells, because its shell path has never run, and
      # measures far lower: this runner passes its own floors here, where the choice can be read.
      - name: Test
        run: |
          set -euo pipefail
          floors=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            floors="-Dcoverage.bundle.line=0.45 -Dcoverage.bundle.method=0.47 -Dcoverage.bundle.branch=0.45"
            # The large packages' own floors too: without the shell and window tests they have
            # nothing to hold here.
            floors="$floors -Dcoverage.package.ui=0 -Dcoverage.package.root=0 -Dcoverage.package.term=0"
          fi
          ./mvnw -B --no-transfer-progress verify $floors
        shell: bash

      # Even when the tests pass (REL-27, Pauta 2.0.2): a flaky test is found by reading the
      # reports of the runs that passed as well as the one that did not.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-${{ matrix.os }}
          path: target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

      # The totals from JaCoCo's CSV, on the run's summary page, so a drop is seen without
      # downloading anything.
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then echo "No coverage report for ${{ matrix.os }}." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          awk -F, -v os="${{ matrix.os }}" '
            function pct(c, m) { return (c + m) == 0 ? "n/a" : sprintf("%.1f%%", 100 * c / (c + m)) }
            NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7; mm += $12; mc += $13 }
            END {
              printf "### Coverage (%s)\n\n| Lines | Branches | Methods |\n|---|---|---|\n| %s | %s | %s |\n",
                os, pct(lc, lm), pct(bc, bm), pct(mc, mm)
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    # Packaging trains the AOT cache and, on Linux, builds and checks every installer.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jlink and jpackage are host-specific: there is no cross-building, so each platform's image
      # can only be produced by that platform. This is the step that says whether a release could
      # be cut today, which is why it runs on every push rather than only on a tag.
      - name: Installer prerequisites
        if: matrix.os == 'ubuntu-latest'
        # fakeroot and rpm for the bundlers; xvfb so AOT training (during the build) and the smoke
        # test have a display; desktop-file-utils, cpio and appstream for the package checks;
        # debsig-verify for checking the deb's signature. rpm carries rpmsign.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot rpm binutils xvfb desktop-file-utils cpio appstream \
            debsig-verify

      - name: Package
        shell: bash
        env:
          # A missing AOT cache fails the build here rather than quietly costing a quarter of
          # startup in whatever ships next.
          TERMINA_REQUIRE_AOT: '1'
        run: |
          set -euo pipefail
          # Linux builds the installers too, because that is where their contents get checked. The
          # other platforms only need to prove the app image builds.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests -Dskip.installers=false package
          else
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package
          fi

      - name: Check the image exists and is not empty
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d target/dist ]; then
            echo "::error::no app image was produced"
            exit 1
          fi
          du -sh target/dist/* || true

      # PERF-17 (Pauta 6.0.1): the release build precompiles the stylesheets, and JavaFX loads a
      # .bss in place of the .css beside it. Asked of the linked image itself, not of the build's
      # folders: a step that ran after the jar was made would leave them there and nowhere else.
      - name: Check the image carries the precompiled stylesheets
        shell: bash
        run: |
          set -euo pipefail
          modules="$(find target/dist -type f -name modules -path '*lib/modules' | head -n 1)"
          if [ -z "$modules" ]; then
            echo "::error::no linked runtime image under target/dist"
            exit 1
          fi
          listing="$(jimage list "$modules")"
          for sheet in app settings editora-dark editora-light; do
            if ! grep -q "com/termina/styles/$sheet\.bss" <<<"$listing"; then
              echo "::error::$sheet.bss is not in the image"
              exit 1
            fi
          done

      # Launches the packaged application and checks a shell actually ran in it. Until this existed
      # nothing had ever started the Windows or Linux binary: the jobs built them, checked the files
      # were present, and stopped. The release runs the same script on every artefact it publishes.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-*)   launcher="target/dist/Termina.app/Contents/MacOS/Termina" ;;
            windows-*) launcher="target/dist/Termina/Termina.exe" ;;
            *)         launcher="target/dist/Termina/bin/Termina" ;;
          esac
          bash scripts/smoke-test.sh "$launcher" "$RUNNER_TEMP/smoke"

      # CLI-11 (Pauta 6.0.1): Termina.exe is a GUI program with no console, so the image carries
      # termina-cli.exe, the same entry point built as a console program. It has to exist and
      # answer --version where it was run.
      - name: Check the Windows console launcher
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$(target/dist/Termina/termina-cli.exe --version)"
          echo "$out"
          echo "$out" | grep -q '^Termina '

      # The seal the macOS fix-up re-signs. An unquarantined launch, like the smoke test's, does not
      # check it; a downloaded copy does, and calls a broken one "damaged".
      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 target/dist/Termina.app

      # Each of these once failed silently — a desktop entry jpackage replaced, a stock Java icon, a
      # dependency that exists only on the newest distributions — so they are asserted against the
      # real .deb, .rpm, AppImage and tarball rather than the source files. Uses what the Package
      # step built. Rebuilding here fails outright: jpackage refuses to write over an existing image.
      - name: Check the Linux packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/check-linux-packages.sh target/installers branding/termina.png

      # The AppImage starts the image from a mount of its own, through AppRun, which the smoke test
      # of the image above never goes near. Extracted rather than mounted: the runner has no FUSE.
      - name: Smoke-test the AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/smoke-test.sh "$(ls target/installers/*.AppImage)" "$RUNNER_TEMP/smoke-appimage"

      # The release's signing step, run with a key made for this job and thrown away with it, so a
      # change that breaks rpmsign, the deb signature or the checks is found here and not on release day.
      - name: Sign the Linux packages with a throw-away key
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key 'Termina CI <ci@termina.invalid>' rsa4096 sign 1d
          TERMINA_GPG_KEY="$(gpg --batch --armor --export-secret-keys)"
          export TERMINA_GPG_KEY
          unset GNUPGHOME
          bash scripts/sign-linux-packages.sh "$RUNNER_TEMP/ci-key.asc" target/installers
          bash scripts/check-linux-signatures.sh "$RUNNER_TEMP/ci-key.asc" target/installers
