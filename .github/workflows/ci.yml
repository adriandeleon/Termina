# Build and test on all three platforms.
#
# Termina claims to be cross-platform, and until this existed only macOS had ever compiled it. The
# Windows shell resolution in particular — pwsh, then powershell, then COMSPEC — had never run
# anywhere at all.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older one on the same branch; nothing is learned from finishing a run
  # against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: ./mvnw -B --no-transfer-progress verify
        shell: bash

      - name: Upload test reports
        # Only the failures matter here, and only then.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jlink and jpackage are host-specific: there is no cross-building, so each platform's image
      # can only be produced by that platform. This is the step that says whether a release could
      # be cut today, which is why it runs on every push rather than only on a tag.
      - name: Installer prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot rpm binutils

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Linux builds the installers too, because that is where their contents get checked. The
          # other platforms only need to prove the app image builds.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests -Dskip.installers=false package
          else
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package
          fi

      - name: Check the image exists and is not empty
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d target/dist ]; then
            echo "::error::no app image was produced"
            exit 1
          fi
          du -sh target/dist/* || true

      # Launches the packaged application and checks a shell actually ran in it. Until this existed
      # nothing had ever started the Windows or Linux binary: the jobs built them, checked the files
      # were present, and stopped. Text on screen proves the whole chain — JVM, JavaFX, a real
      # pseudo-terminal, a shell, and the emulator parsing what it wrote — where a screenshot proves
      # only that a window appeared.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-*)   launcher="target/dist/Termina.app/Contents/MacOS/Termina" ;;
            windows-*) launcher="target/dist/Termina/Termina.exe" ;;
            *)         launcher="target/dist/Termina/bin/Termina" ;;
          esac
          [ -x "$launcher" ] || { echo "::error::no launcher at $launcher"; exit 1; }

          # whoami exists on all three, takes no arguments — JAVA_TOOL_OPTIONS cannot carry a space
          # inside a -D value — and prints something this job can predict and check for.
          me=$(whoami)
          echo "expecting the shell to print: $me"

          export JAVA_TOOL_OPTIONS="-Dtermina.capture=$RUNNER_TEMP/smoke.png -Dtermina.captureCommand=whoami -Dtermina.captureScreenText=true -Dtermina.captureAfterCommandMs=4000"
          export TERMINA_CONFIG_DIR="$RUNNER_TEMP/smoke-config"

          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "$launcher" > "$RUNNER_TEMP/smoke.log" 2>&1 || true
          else
            "$launcher" > "$RUNNER_TEMP/smoke.log" 2>&1 || true
          fi

          echo "--- what the terminal showed ---"
          sed -n '/screen<<</,/>>>/p' "$RUNNER_TEMP/smoke.log" || true

          [ -s "$RUNNER_TEMP/smoke.png" ] || { echo "::error::no screenshot — the window never rendered"; exit 1; }
          grep -q "terminals=1" "$RUNNER_TEMP/smoke.log" || { echo "::error::no terminal was created"; exit 1; }
          # The command being on screen only proves it was typed; the answer proves a shell ran it.
          grep -qi "$me" "$RUNNER_TEMP/smoke.log" || { echo "::error::the shell did not run the command"; exit 1; }
          echo "smoke test: a shell ran and printed in the packaged app"

      # The Linux packages carry a desktop entry that jpackage will happily replace with its own if
      # the override is not named exactly after the launcher. That failure is silent — the package
      # builds, installs, and simply has no StartupWMClass — so it is asserted against a real
      # package rather than against the source file.
      - name: Check the Linux package contents
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq desktop-file-utils
          # Uses what the Package step built. Rebuilding here fails outright — jpackage refuses to
          # write over an existing image — which is how this check first went red without ever
          # reaching an assertion.
          deb=$(ls target/installers/*.deb)
          echo "inspecting $deb"
          dpkg-deb --contents "$deb" | grep -qE "termina.aot" || {
            echo "::error::the package has no AOT cache — startup would be a quarter slower"; exit 1; }

          rm -rf "$RUNNER_TEMP/deb" && mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          entry=$(find "$RUNNER_TEMP/deb" -name "*.desktop" | head -1)
          [ -n "$entry" ] || { echo "::error::the package installs no desktop entry"; exit 1; }
          echo "--- shipped desktop entry ---"; cat "$entry"

          desktop-file-validate "$entry"
          grep -q "^StartupWMClass=com.termina.App$" "$entry" || {
            echo "::error::no StartupWMClass — the override was ignored, as it is when misnamed"; exit 1; }
          grep -q "^Categories=.*TerminalEmulator" "$entry" || {
            echo "::error::not registered as a terminal emulator"; exit 1; }
          # jpackage substitutes only some of its own tokens; an unsubstituted one ships literally
          # and makes the key invalid.
          if grep -q "APPLICATION_" "$entry"; then
            echo "::error::an APPLICATION_* placeholder was not substituted"
            exit 1
          fi
          echo "package contents: OK"
