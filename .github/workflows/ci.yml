# Build and test on all three platforms.
#
# Termina claims to be cross-platform, and until this existed only macOS had ever compiled it. The
# Windows shell resolution in particular — pwsh, then powershell, then COMSPEC — had never run
# anywhere at all.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older one on the same branch; nothing is learned from finishing a run
  # against code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: ./mvnw -B --no-transfer-progress verify
        shell: bash

      - name: Upload test reports
        # Only the failures matter here, and only then.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jlink and jpackage are host-specific: there is no cross-building, so each platform's image
      # can only be produced by that platform. This is the step that says whether a release could
      # be cut today, which is why it runs on every push rather than only on a tag.
      - name: Package
        run: ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package
        shell: bash

      - name: Check the image exists and is not empty
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d target/dist ]; then
            echo "::error::no app image was produced"
            exit 1
          fi
          du -sh target/dist/* || true

      # Launches the packaged application and checks a shell actually ran in it. Until this existed
      # nothing had ever started the Windows or Linux binary: the jobs built them, checked the files
      # were present, and stopped. Text on screen proves the whole chain — JVM, JavaFX, a real
      # pseudo-terminal, a shell, and the emulator parsing what it wrote — where a screenshot proves
      # only that a window appeared.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-*)   launcher="target/dist/Termina.app/Contents/MacOS/Termina" ;;
            windows-*) launcher="target/dist/Termina/Termina.exe" ;;
            *)         launcher="target/dist/Termina/bin/Termina" ;;
          esac
          [ -x "$launcher" ] || { echo "::error::no launcher at $launcher"; exit 1; }

          # whoami exists on all three, takes no arguments — JAVA_TOOL_OPTIONS cannot carry a space
          # inside a -D value — and prints something this job can predict and check for.
          me=$(whoami)
          echo "expecting the shell to print: $me"

          export JAVA_TOOL_OPTIONS="-Dtermina.capture=$RUNNER_TEMP/smoke.png -Dtermina.captureCommand=whoami -Dtermina.captureScreenText=true -Dtermina.captureAfterCommandMs=4000"
          export TERMINA_CONFIG_DIR="$RUNNER_TEMP/smoke-config"

          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "$launcher" > "$RUNNER_TEMP/smoke.log" 2>&1 || true
          else
            "$launcher" > "$RUNNER_TEMP/smoke.log" 2>&1 || true
          fi

          echo "--- what the terminal showed ---"
          sed -n '/screen<<</,/>>>/p' "$RUNNER_TEMP/smoke.log" || true

          [ -s "$RUNNER_TEMP/smoke.png" ] || { echo "::error::no screenshot — the window never rendered"; exit 1; }
          grep -q "terminals=1" "$RUNNER_TEMP/smoke.log" || { echo "::error::no terminal was created"; exit 1; }
          # The command being on screen only proves it was typed; the answer proves a shell ran it.
          grep -qi "$me" "$RUNNER_TEMP/smoke.log" || { echo "::error::the shell did not run the command"; exit 1; }
          echo "smoke test: a shell ran and printed in the packaged app"

      # The Linux installer makes claims about where jpackage puts things. Checked by machine on the
      # platform that produces the layout, rather than believed from a macOS desk.
      - name: Check the Linux image layout and desktop entry
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          echo "--- image layout ---"
          find target/dist -maxdepth 2 | head -20

          launcher=target/dist/Termina/bin/Termina
          [ -x "$launcher" ] || { echo "::error::no executable launcher at $launcher"; exit 1; }
          echo "launcher: OK"

          # The installer prefers this icon and falls back to branding/. Not fatal either way, but
          # worth knowing which path is actually being taken.
          if [ -f target/dist/Termina/lib/Termina.png ]; then
            echo "icon: jpackage supplied lib/Termina.png"
          else
            echo "::warning::no lib/Termina.png in the image; the installer will use branding/termina.png"
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils shellcheck
          desktop-file-validate packaging/linux/termina.desktop
          echo "desktop entry: valid"
          shellcheck packaging/linux/install.sh
          echo "installer: shellcheck clean"

          # A dry run into a throwaway prefix: proves the script actually installs, rather than
          # proving only that it parses.
          cp -r target/dist/Termina packaging/linux/
          ( cd packaging/linux && ./install.sh --prefix "$RUNNER_TEMP/prefix" )
          test -x "$RUNNER_TEMP/prefix/bin/termina"
          test -f "$RUNNER_TEMP/prefix/share/applications/termina.desktop"
          desktop-file-validate "$RUNNER_TEMP/prefix/share/applications/termina.desktop"
          grep -q "^Exec=$RUNNER_TEMP/prefix" "$RUNNER_TEMP/prefix/share/applications/termina.desktop"
          echo "install: OK"
          ( cd packaging/linux && ./install.sh --prefix "$RUNNER_TEMP/prefix" --uninstall )
          test ! -e "$RUNNER_TEMP/prefix/bin/termina"
          echo "uninstall: OK"
