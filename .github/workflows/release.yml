# Build the app image on every platform and attach the archives to a GitHub release.
#
# Triggered by a v* tag. The pom's version is the single source of truth: the tag has to agree with
# it, and the build fails loudly if it does not — artifacts labelled with a version they were not
# built from are worse than no artifacts.
name: Release

on:
  push:
    tags: ['v*']
  # For a dry run: builds and uploads artifacts, creates no release.
  workflow_dispatch:

# Read-only by default. The build jobs run Maven against a repository outside Central and execute
# what it resolves; none of them needs to write anything, so none of them holds a token that can.
# Only the publish job below asks for more.
permissions:
  contents: read

# One release run per ref at a time, and never cancelled: a half-finished release can leave a tag
# with some of its downloads attached, and GitHub releases are immutable.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # The macOS legs include notarization, whose own step allows 35 minutes.
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
          - os: windows-latest
            target: windows-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pom=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          public="${pom%-SNAPSHOT}"
          echo "version=$public" >> "$GITHUB_OUTPUT"
          # A tag must have its notes written before anything is built (DOCS-05).
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then bash scripts/release-notes.sh "$public" > /dev/null; fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$public" ]; then
              echo "::error::tag v$tag does not match the pom version $pom"
              echo "::error::Set <version> in pom.xml to $tag (without -SNAPSHOT) and re-tag."
              exit 1
            fi
            if [ "$pom" != "$public" ]; then
              echo "::error::refusing to release a snapshot ($pom); drop -SNAPSHOT from pom.xml"
              exit 1
            fi
          fi
          echo "Building $public for ${{ matrix.target }}"

      # jpackage shells out to each platform's own packaging tools, and none of them are a given on
      # a fresh runner.
      - name: Installer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              # dpkg-deb is present; rpmbuild is not, and jpackage fails the rpm without it. xvfb
              # gives AOT training and the smoke test a display; desktop-file-utils, cpio and
              # appstream are for the package checks.
              sudo apt-get update -qq
              sudo apt-get install -y -qq fakeroot rpm binutils xvfb desktop-file-utils cpio appstream
              ;;
            Windows)
              # jpackage builds an MSI through WiX and cannot make one without it. Pinned: the path
              # below names 3.14, and an unpinned install is whatever the package became today.
              choco install wixtoolset --version 3.14.1.20250415 --no-progress -y
              echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
              ;;
          esac

      # macOS Developer ID signing: the .p12 (certificate + key + Apple's Developer ID G2 intermediate)
      # goes into a throw-away keychain, and the identity it holds is handed to the build, where
      # scripts/sign-mac-app.sh signs the finished app and build-installers.sh its dmg. "Notarize the dmg"
      # below has Apple notarize it and staples the ticket. The secrets: README, "macOS signing".
      #
      # On a tag, missing secrets fail the leg: an unsigned dmg is what this exists to stop shipping, and a
      # published release is immutable. A manual dry run without them builds ad-hoc signed and says so.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=macOS signing secrets missing::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to release an unsigned dmg"
              exit 1
            fi
            echo "::warning title=macOS build unsigned::no signing secrets, so this dry run's dmg is ad-hoc signed and not notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/termina-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          # No auto-lock during the build (the default locks after 5 minutes of inactivity).
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          p12="$RUNNER_TEMP/termina-signing.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          if ! security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$p12"
            echo "::error title=Certificate import failed::macOS could not open MACOS_CERT_P12 with MACOS_CERT_PASSWORD. Usually the password secret does not match the .p12 (re-set it at the gh prompt; a piped echo adds a newline); otherwise the .p12 was exported without openssl's -legacy"
            exit 1
          fi
          rm -f "$p12"
          # Lets codesign use the key without the GUI prompt a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Add it to the search list next to the login keychain, which codesign needs to build the chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error title=No Developer ID identity::the imported .p12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          {
            echo "TERMINA_MAC_SIGN_IDENTITY=$identity"
            echo "TERMINA_MAC_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # With the tests, unlike CI's package job: a tag is not gated on CI having passed, and two of
      # these runners (linux-arm64, macos-x64) run nowhere else, so this is the only place their
      # build is ever tested. `verify` is the phase CI's test job runs, after `package`.
      - name: Build, test and package
        run: |
          set -euo pipefail
          # The pom has one set of coverage floors (PLAT-12, Pauta 6.0.1); the Windows runner, which
          # skips the tests that drive real shells, passes its own, as ci.yml's does.
          floors=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            floors="-Dcoverage.bundle.line=0.45 -Dcoverage.bundle.method=0.47 -Dcoverage.bundle.branch=0.45"
          fi
          ./mvnw -B --no-transfer-progress clean -Pdist -Dskip.installers=false verify $floors
        shell: bash
        env:
          # A release without its AOT cache starts a quarter slower and says nothing; fail instead.
          TERMINA_REQUIRE_AOT: '1'

      # Every check CI makes of its artefacts, made of the ones being published. A failure here
      # fails this target's job, and the publish job needs all of them.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS)   launcher="target/dist/Termina.app/Contents/MacOS/Termina" ;;
            Windows) launcher="target/dist/Termina/Termina.exe" ;;
            *)       launcher="target/dist/Termina/bin/Termina" ;;
          esac
          bash scripts/smoke-test.sh "$launcher" "$RUNNER_TEMP/smoke"

      - name: Check the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --verbose=2 target/dist/Termina.app

      # Apple scans the signed dmg and, if it passes, issues a ticket; stapling attaches it so Gatekeeper
      # accepts the dmg offline too. A rejection prints Apple's log, which names each offending file. The
      # checks at the end are what Gatekeeper does on a user's Mac: the dmg and the app inside it must both
      # be accepted as notarized Developer ID code, by our team, and the notarized app must launch and run
      # a shell — the smoke test above ran the image before the dmg wrap and the ticket.
      - name: Notarize the dmg (macOS)
        if: steps.macsign.outputs.enabled == 'true'
        shell: bash
        timeout-minutes: 35
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error title=Notarization secrets missing::APPLE_API_KEY_P8 / APPLE_API_KEY_ID are not set"
            exit 1
          fi
          # Easy to mix up when copying them off the Integrations page: the issuer is a UUID shown above the
          # key list, the key ID is 10 characters in the key's row. Say which one is wrong before Apple does.
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$APPLE_API_ISSUER" ] && ! [[ "$APPLE_API_ISSUER" =~ $uuid ]]; then
            echo "::error title=APPLE_API_ISSUER is not an issuer ID::it must be the UUID shown as Issuer ID above the team key list (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"
            exit 1
          fi
          if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_API_KEY_ID is not a key ID::it must be the 10-character Key ID from the key's row"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A team key needs the issuer; an individual key has none.
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER" ] && auth+=(--issuer "$APPLE_API_ISSUER")

          dmg="$(ls target/installers/*.dmg | head -1)"
          # The app INSIDE the dmg must still carry our signature, intact: jpackage re-signs an image it
          # believes unsigned, ad hoc, and anything the wrap changes in the bundle breaks the seal. Checking
          # here takes seconds and names the changed file; Apple takes minutes to say only "invalid".
          pre="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$pre" "$dmg" > /dev/null
          if ! codesign -dv --verbose=2 "$pre"/*.app 2>&1 | grep -q '^Authority=Developer ID Application'; then
            codesign -dv --verbose=2 "$pre"/*.app || true
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app not Developer ID signed::the app inside $(basename "$dmg") lost its Developer ID signature during the dmg wrap"
            exit 1
          fi
          # Signed by our team and nobody else's (REL-15, Pauta 2.0.2): a certificate swapped in the
          # secrets would otherwise sign, notarize and ship under someone else's name.
          if ! codesign -dv --verbose=2 "$pre"/*.app 2>&1 | grep -q '^TeamIdentifier=8JKSF797L8$'; then
            codesign -dv --verbose=2 "$pre"/*.app 2>&1 | grep '^TeamIdentifier' || true
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=Wrong signing team::the app inside $(basename "$dmg") is not signed by team 8JKSF797L8"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=4 "$pre"/*.app; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app signature broken::the app inside $(basename "$dmg") no longer verifies; the codesign output above names what changed"
            exit 1
          fi
          hdiutil detach "$pre" > /dev/null

          echo "Notarizing $dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty')"
          status="$(printf '%s' "$out" | jq -r '.status // empty')"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm -f "$key"
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::Apple returned '${status:-no result}' for $(basename "$dmg"); the log above lists the problems"
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN and validates it in the same call. That fetch
          # can drop, and the ticket sometimes takes a moment to publish, so retry it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && { echo "::error title=Stapling failed::notarized, but the ticket could not be stapled"; exit 1; }
            sleep 20
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null 2>&1 || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # Then launch the notarized app itself, from the dmg a user will open, and see a shell run in
          # it (REL-15): the image's smoke test above ran before the wrap and the ticket, and either can
          # break a launch the earlier one cannot see.
          bash scripts/smoke-test.sh "$app/Contents/MacOS/Termina" "$RUNNER_TEMP/smoke-notarized"
          echo "- ✅ ${{ matrix.target }}: signed, notarized, stapled and launched" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/check-linux-packages.sh target/installers branding/termina.png

      # Through AppRun and the AppImage runtime, which the image's own smoke test never reaches.
      # Extracted rather than mounted: the runner has no FUSE.
      - name: Smoke-test the AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/smoke-test.sh "$(ls target/installers/*.AppImage)" "$RUNNER_TEMP/smoke-appimage"

      # jpackage names its output after the version it was given, which on macOS is the bumped
      # placeholder (1.1.0 for a 0.1.0 release) and everywhere else carries no target. Renaming to
      # one scheme is what makes four platforms' downloads legible on a single release page.
      - name: Name the installers
        id: installers
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          cd target/installers
          shopt -s nullglob
          produced=0
          for file in *; do
            case "$file" in
              *.tar.gz) ext=tar.gz ;;
              *)        ext="${file##*.}" ;;
            esac
            mv -v "$file" "Termina-$version-${{ matrix.target }}.$ext"
            produced=$((produced + 1))
          done
          if [ "$produced" = 0 ]; then
            echo "::error::no installer was produced for ${{ matrix.target }}"
            exit 1
          fi
          ls -la

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termina-${{ matrix.target }}
          path: target/installers/*
          retention-days: 14
          if-no-files-found: error

      # The runner is ephemeral, but the keychain holds the private key, so remove it as soon as we're done.
      - name: Remove signing keychain (macOS)
        if: always() && steps.macsign.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/termina-signing.keychain-db" || true

  # Signs the Linux downloads (scripts/sign-linux-packages.sh): rpm and deb embedded, and a detached
  # .asc beside every file. In a job of its own so the key is never on a runner that builds — those
  # run whatever Maven resolves — and once for both architectures, since a signature does not care
  # which one it covers. It replaces the build job's artifacts with the signed files, so the publish
  # job and its provenance attestation see only those. The secrets: README, "Linux signing".
  #
  # On a tag the key is required, and must be the committed packaging/linux/signing-key.asc. A manual
  # dry run without it signs with a key made for the run, so the step is still exercised, and says so.
  sign-linux:
    name: Sign Linux packages
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Signing tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm debsig-verify

      # One directory per artifact: linux/Termina-linux-x64, linux/Termina-linux-arm64.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Termina-linux-*
          path: linux

      - name: Sign
        shell: bash
        env:
          LINUX_GPG_KEY: ${{ secrets.LINUX_GPG_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$LINUX_GPG_KEY" ]; then
            export TERMINA_GPG_KEY="$LINUX_GPG_KEY" TERMINA_GPG_PASSPHRASE="$LINUX_GPG_PASSPHRASE"
            if [ "$GITHUB_REF_TYPE" = "tag" ] || [ -f packaging/linux/signing-key.asc ]; then
              export TERMINA_GPG_EXPECTED_KEY=packaging/linux/signing-key.asc
            fi
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "::error title=Linux signing key missing::LINUX_GPG_KEY is not set; refusing to release unsigned Linux packages"
            exit 1
          else
            echo "::warning title=Linux packages signed with a throw-away key::no LINUX_GPG_KEY, so this dry run signs with a key made for it"
            export GNUPGHOME="$RUNNER_TEMP/throwaway-gnupg"
            mkdir -m 700 "$GNUPGHOME"
            gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key 'Termina dry run <dry-run@termina.invalid>' rsa4096 sign 1d
            TERMINA_GPG_KEY="$(gpg --batch --armor --export-secret-keys)"
            export TERMINA_GPG_KEY
            unset GNUPGHOME
          fi
          mkdir -p key
          bash scripts/sign-linux-packages.sh key/termina-signing-key.asc linux/*/
          bash scripts/check-linux-signatures.sh key/termina-signing-key.asc linux/*/
          ls -la linux/*/
          fpr=$(gpg --with-colons --import-options show-only --import key/termina-signing-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "- ✅ Linux: signed with \`$fpr\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed (linux-x64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termina-linux-x64
          path: linux/Termina-linux-x64/*
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload signed (linux-arm64)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termina-linux-arm64
          path: linux/Termina-linux-arm64/*
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload the public key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Termina-signing-key
          path: key/termina-signing-key.asc
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build, sign-linux]
    timeout-minutes: 30
    # A tag publishes. A manual run is a dry run (REL-21, Pauta 2.0.2): it gathers and checks every
    # download and runs JReleaser with --dry-run, which publishes and attests nothing.
    # The only job that writes: contents for the release itself, and id-token plus attestations
    # for the build provenance below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # JReleaser reads the git history to build the changelog, and warns that a shallow copy
          # may fail. The default checkout is depth 1.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Set up JDK 25
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'

      - name: List what will be released
        run: ls -la artifacts

      # Exactly the files jreleaser.yml attaches, before anything is published: a GitHub release is
      # immutable, so a download missing from one cannot be added afterwards (REL-07). The same check
      # makes the attestation below cover the same list JReleaser attaches (REL-18).
      - name: Check every download is here
        shell: bash
        run: bash scripts/check-release-assets.sh "${{ needs.build.outputs.version }}" artifacts

      # The release notes: install instructions and the version's CHANGELOG.md section, which
      # jreleaser.yml reads. A manual dry run's version has no section yet, so [Unreleased] stands in.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            bash scripts/release-notes.sh "${{ needs.build.outputs.version }}" > out/release-notes.md
          else
            bash scripts/release-notes.sh "${{ needs.build.outputs.version }}" --unreleased-ok > out/release-notes.md
          fi
          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      # A signed statement, kept by GitHub, that each installer was built by this workflow from this
      # commit. `gh attestation verify <file> --repo adriandeleon/Termina` checks a download.
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'artifacts/*'

      # Decided here rather than by editing config: with no token the package managers are excluded
      # outright, and the moment PACKAGES_TOKEN exists they are included again with no change to
      # anything. Excluding is not the same as letting them fail — a skipped packager says so in one
      # line, where a failed one buries the reason in a stack trace nobody reads on release day.
      - name: Decide which packagers can run
        id: packagers
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          dry=""
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            dry=" --dry-run"
            echo "::notice::Manual run: JReleaser runs with --dry-run and publishes nothing."
          fi
          if [ -n "${PACKAGES_TOKEN:-}" ]; then
            echo "args=full-release$dry" >> "$GITHUB_OUTPUT"
            echo "PACKAGES_TOKEN is set: the Homebrew cask and winget PR will be published."
          else
            echo "args=full-release$dry --exclude-packager brew --exclude-packager winget" >> "$GITHUB_OUTPUT"
            echo "::notice::No PACKAGES_TOKEN — publishing the GitHub release only. No Homebrew cask, no winget pull request."
          fi

      # Pinned to a commit, not the movable v2 branch: this step is handed a token that can write
      # to this repository, the Homebrew tap and the winget fork. The JReleaser it downloads is
      # pinned too — the action's default is whatever was released last. Bump both deliberately.
      - name: Publish release
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # v2.5.0
        with:
          version: 1.26.0
          arguments: ${{ steps.packagers.outputs.args }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.build.outputs.version }}
          # Creates the release in this repository.
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes to the Homebrew tap and opens the winget pull request. Those live in other
          # repositories, which the default GITHUB_TOKEN cannot write to — so this must be a PAT
          # with repo scope. Without it both packagers fail, and because both are continueOnError
          # the release itself still succeeds.
          JRELEASER_BREW_GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          JRELEASER_WINGET_GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # JReleaser writes the checksums file it attaches; it gets the same provenance as the files it
      # vouches for (REL-18), or a tampered checksums file would verify a tampered download.
      - name: Attest the checksums file
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/jreleaser/checksums/checksums_sha256.txt'

      - name: Upload JReleaser output
        # The trace is the only way to tell a packager that was skipped from one that failed.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-logs
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
          retention-days: 7

  # Moves master to the next development version once a release is out (REL-06, Pauta 2.0.2): the
  # minor number up, as every release since 0.1.0 has started the next. A pull request, not a push,
  # so master's protections apply. One opened with GITHUB_TOKEN starts no workflows of its own;
  # closing and reopening it runs CI. Needs "Allow GitHub Actions to create and approve pull
  # requests" in the repository's Actions settings.
  bump:
    name: Start the next snapshot
    runs-on: ubuntu-latest
    needs: [build, release]
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Open the bump pull request
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          IFS=. read -r major minor _ <<<"$RELEASED"
          next="$major.$((minor + 1)).0-SNAPSHOT"
          current="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
          if [ "$current" = "$next" ]; then
            echo "master is already on $next."
            exit 0
          fi
          branch="build/start-$next"
          git switch -c "$branch"
          # The project's own <version>, the first at four spaces of indent; dependencies' are deeper.
          sed -i "0,/^    <version>.*<\/version>\$/s||    <version>$next</version>|" pom.xml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -am "build: start $next"
          git push -u origin "$branch"
          gh pr create --base master --head "$branch" --title "build: start $next" \
            --body "Released $RELEASED. Opened by the release workflow; close and reopen it to run CI."
