# Weekly updates for the actions the workflows pin by commit SHA, and for the Maven build
# (REL-23, Pauta 2.0.2). A SHA pin never moves by itself, so without this nothing ever would.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Held at 3.1.0, as the comment above its version in pom.xml says: 3.2.0 warns once for
      # every Maven property exportAntProperties would carry back (31 lines on a dist build,
      # checked 2026-11-07) and the executions need nothing it adds.
      - dependency-name: org.apache.maven.plugins:maven-antrun-plugin
