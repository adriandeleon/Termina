# The second launcher in the Windows image (CLI-11, Pauta 6.0.1): the same entry point as
# Termina.exe, built as a console program. Termina.exe is a GUI program and has no console, so
# --help, --version, --report and the refusal of an unknown option print nothing in the terminal
# they were typed in; termina-cli.exe prints there. With no such option it opens a window like
# Termina.exe does. No Start menu entry or shortcut: it is for a terminal, not for a click.
win-console=true
win-menu=false
win-shortcut=false
